name: Secure CI/CD Pipeline - AWS 3-Tier DevOps

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-3-tier-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_BACKEND: 202689043428.dkr.ecr.us-east-1.amazonaws.com/aws-3-tier-devops-backend
  ECR_FRONTEND: 202689043428.dkr.ecr.us-east-1.amazonaws.com/aws-3-tier-devops-frontend
  EKS_CLUSTER_NAME: three-tier-cluster
  EKS_NAMESPACE: three-tier-dev

jobs:
  terraform-security:
    name: Terraform Security and Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform Initialize
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      - name: Checkov Terraform Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false

      - name: Trivy Terraform Configuration Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: terraform/
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  build-and-scan:
    name: Build and Scan Application Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build --pull -t "$ECR_BACKEND:$GITHUB_SHA" ./backend

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_BACKEND }}:${{ github.sha }}
          scan-type: image
          scanners: vuln
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build Frontend Image
        run: |
          docker build --pull -t "$ECR_FRONTEND:$GITHUB_SHA" ./frontend

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_FRONTEND }}:${{ github.sha }}
          scan-type: image
          scanners: vuln
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  deploy:
    if: ${{ false }}
    name: Publish Images and Deploy to EKS
    runs-on: ubuntu-latest
    needs:
      - terraform-security
      - build-and-scan
    timeout-minutes: 25

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::202689043428:role/GitHubActions-EKS-3Tier-Deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Images for Publishing
        run: |
          docker build --pull -t "$ECR_BACKEND:$GITHUB_SHA" ./backend
          docker build --pull -t "$ECR_FRONTEND:$GITHUB_SHA" ./frontend

      - name: Push Versioned Images
        run: |
          docker push "$ECR_BACKEND:$GITHUB_SHA"
          docker push "$ECR_FRONTEND:$GITHUB_SHA"

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Verify Kubernetes Permissions
        run: |
          set -euo pipefail
          kubectl get namespace "$EKS_NAMESPACE"
          kubectl auth can-i get deployments -n "$EKS_NAMESPACE" | grep -qx yes
          kubectl auth can-i patch deployments -n "$EKS_NAMESPACE" | grep -qx yes
          kubectl auth can-i create deployments -n "$EKS_NAMESPACE" | grep -qx yes
          kubectl auth can-i create services -n "$EKS_NAMESPACE" | grep -qx yes

      - name: Render Versioned Manifests
        shell: bash
        run: |
          set -euo pipefail

          sed "s#${ECR_BACKEND}:latest#${ECR_BACKEND}:${GITHUB_SHA}#g" \
            k8s/backend.yaml > /tmp/backend.yaml

          sed -E "s#${ECR_FRONTEND}(:latest|@sha256:[[:xdigit:]]+)#${ECR_FRONTEND}:${GITHUB_SHA}#g" \
            k8s/frontend.yaml > /tmp/frontend.yaml

          grep -Eq "image:[[:space:]]*${ECR_BACKEND}:${GITHUB_SHA}" /tmp/backend.yaml
          grep -Eq "image:[[:space:]]*${ECR_FRONTEND}:${GITHUB_SHA}" /tmp/frontend.yaml

          echo "Rendered backend and frontend image references:"
          grep -n "image:" /tmp/backend.yaml /tmp/frontend.yaml

      - name: Scan Rendered Kubernetes Manifests
        uses: bridgecrewio/checkov-action@master
        with:
          file: /tmp/backend.yaml,/tmp/frontend.yaml
          framework: kubernetes
          soft_fail: false

      - name: Validate Deployment Manifests
        run: |
          set -euo pipefail
          kubectl apply --dry-run=server \
            -f /tmp/backend.yaml \
            -n "$EKS_NAMESPACE"

          kubectl apply --dry-run=server \
            -f /tmp/frontend.yaml \
            -n "$EKS_NAMESPACE"

      - name: Deploy Backend
        run: |
          kubectl apply -f /tmp/backend.yaml -n "$EKS_NAMESPACE"

      - name: Verify Backend Rollout
        run: |
          kubectl rollout status deployment/backend \
            -n "$EKS_NAMESPACE" \
            --timeout=180s

      - name: Deploy Frontend
        run: |
          kubectl apply -f /tmp/frontend.yaml -n "$EKS_NAMESPACE"

      - name: Verify Frontend Rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n "$EKS_NAMESPACE" \
            --timeout=180s

      - name: Show Deployment Status
        if: always()
        run: |
          kubectl get deployments,pods,services \
            -n "$EKS_NAMESPACE" || true
