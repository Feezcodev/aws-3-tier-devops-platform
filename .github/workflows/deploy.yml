
name: Secure CI/CD Pipeline - AWS 3-Tier DevOps

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "terraform/terraform.tfstate*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aws-3-tier-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "202689043428"
  ECR_BACKEND: 202689043428.dkr.ecr.us-east-1.amazonaws.com/aws-3-tier-devops-backend
  ECR_FRONTEND: 202689043428.dkr.ecr.us-east-1.amazonaws.com/aws-3-tier-devops-frontend
  EKS_CLUSTER_NAME: three-tier-cluster
  EKS_NAMESPACE: three-tier-dev

jobs:
  terraform-security:
    name: Terraform Validation and Security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform Initialize
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      - name: Checkov Terraform Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false

      - name: Trivy Terraform Configuration Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          trivy-config: trivy.yaml
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  test-build-scan:
    name: Test, Build and Scan Images
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Build Backend Image
        run: docker build --pull -t "backend:${GITHUB_SHA}" ./backend

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: backend:${{ github.sha }}
          scan-type: image
          scanners: vuln
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build Frontend Image
        run: docker build --pull -t "frontend:${GITHUB_SHA}" ./frontend

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend:${{ github.sha }}
          scan-type: image
          scanners: vuln
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  deploy:
    name: Publish Images and Deploy to EKS
    runs-on: ubuntu-latest
    needs:
      - terraform-security
      - test-build-scan
    timeout-minutes: 30

    # Only deploy from main after a push or a manual run on main.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::202689043428:role/GitHubActions-EKS-3Tier-Deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Verify ECR Repositories
        run: |
          set -euo pipefail
          aws ecr describe-repositories \
            --repository-names \
              aws-3-tier-devops-backend \
              aws-3-tier-devops-frontend

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Backend Image for Deployment
        run: |
          set -euo pipefail
          docker build --pull \
            -t "$ECR_BACKEND:$GITHUB_SHA" \
            ./backend
          docker tag "$ECR_BACKEND:$GITHUB_SHA" "backend:$GITHUB_SHA"

      - name: Build Frontend Image for Deployment
        run: |
          set -euo pipefail
          docker build --pull \
            -t "$ECR_FRONTEND:$GITHUB_SHA" \
            ./frontend
          docker tag "$ECR_FRONTEND:$GITHUB_SHA" "frontend:$GITHUB_SHA"

      - name: Scan Backend Image Before Publishing
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: backend:${{ github.sha }}
          scan-type: image
          scanners: vuln
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Scan Frontend Image Before Publishing
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend:${{ github.sha }}
          scan-type: image
          scanners: vuln
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push Backend Image to ECR
        run: docker push "$ECR_BACKEND:$GITHUB_SHA"

      - name: Push Frontend Image to ECR
        run: docker push "$ECR_FRONTEND:$GITHUB_SHA"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Verify Cluster Access
        run: |
          set -euo pipefail
          kubectl get nodes
          kubectl get namespace "$EKS_NAMESPACE"

      - name: Verify Deployment Permissions
        run: |
          set -euo pipefail
          kubectl auth can-i get deployments -n "$EKS_NAMESPACE" | grep -qx yes
          kubectl auth can-i create deployments -n "$EKS_NAMESPACE" | grep -qx yes
          kubectl auth can-i patch deployments -n "$EKS_NAMESPACE" | grep -qx yes
          kubectl auth can-i create services -n "$EKS_NAMESPACE" | grep -qx yes

      - name: Render Versioned Kubernetes Manifests
        shell: bash
        run: |
          set -euo pipefail

          sed "s#${ECR_BACKEND}:latest#${ECR_BACKEND}:${GITHUB_SHA}#g" \
            k8s/backend.yaml > /tmp/backend.yaml

          sed -E \
            "s#${ECR_FRONTEND}(:latest|@sha256:[[:xdigit:]]+)#${ECR_FRONTEND}:${GITHUB_SHA}#g" \
            k8s/frontend.yaml > /tmp/frontend.yaml

          grep -Fq "image: ${ECR_BACKEND}:${GITHUB_SHA}" /tmp/backend.yaml
          grep -Fq "image: ${ECR_FRONTEND}:${GITHUB_SHA}" /tmp/frontend.yaml

          echo "Rendered image references:"
          grep -n "image:" /tmp/backend.yaml /tmp/frontend.yaml

      - name: Scan Rendered Kubernetes Manifests
        uses: bridgecrewio/checkov-action@master
        with:
          file: /tmp/backend.yaml,/tmp/frontend.yaml
          framework: kubernetes
          soft_fail: false

      - name: Validate Backend Manifest
        run: |
          kubectl apply --dry-run=server \
            -f /tmp/backend.yaml \
            -n "$EKS_NAMESPACE"

      - name: Validate Frontend Manifest
        run: |
          kubectl apply --dry-run=server \
            -f /tmp/frontend.yaml \
            -n "$EKS_NAMESPACE"

      - name: Deploy Backend
        run: |
          kubectl apply \
            -f /tmp/backend.yaml \
            -n "$EKS_NAMESPACE"

      - name: Verify Backend Rollout
        run: |
          kubectl rollout status deployment/backend \
            -n "$EKS_NAMESPACE" \
            --timeout=180s

      - name: Deploy Frontend
        run: |
          kubectl apply \
            -f /tmp/frontend.yaml \
            -n "$EKS_NAMESPACE"

      - name: Verify Frontend Rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n "$EKS_NAMESPACE" \
            --timeout=180s

      - name: Show Deployment Status
        if: always()
        run: |
          kubectl get deployments,pods,services \
            -n "$EKS_NAMESPACE" || true
