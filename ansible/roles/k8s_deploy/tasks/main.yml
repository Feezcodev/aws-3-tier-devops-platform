---
- name: Ensure three-tier namespace exists
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: three-tier
    state: present

- name: Create MySQL secret
  kubernetes.core.k8s:
    state: present
    namespace: three-tier
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: mysql-secret
      type: Opaque
      stringData:
        DB_PASSWORD: "secretpassword"
        DB_NAME: "appdb"

- name: Apply Database tier manifest
  kubernetes.core.k8s:
    state: present
    namespace: three-tier
    src: "{{ playbook_dir }}/../../k8s/database.yaml"

- name: Apply Backend tier manifest
  kubernetes.core.k8s:
    state: present
    namespace: three-tier
    src: "{{ playbook_dir }}/../../k8s/backend.yaml"

- name: Apply Frontend tier manifest
  kubernetes.core.k8s:
    state: present
    namespace: three-tier
    src: "{{ playbook_dir }}/../../k8s/frontend.yaml"