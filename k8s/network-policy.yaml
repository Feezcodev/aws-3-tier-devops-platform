apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: three-tier-network-policy
  namespace: three-tier-dev
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - frontend
          - backend
          - mysql
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming frontend traffic.
    - ports:
        - protocol: TCP
          port: 8080
    # Allow frontend to reach the backend.
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 5000
    # Allow backend to reach MySQL.
    - from:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 3306
  egress:
    # Frontend to backend.
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 5000
    # Backend to MySQL.
    - to:
        - podSelector:
            matchLabels:
              app: mysql
      ports:
        - protocol: TCP
          port: 3306
    # DNS.
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
